<meta charset="utf-8">
<title>مستشار الفعالية</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Alexandria:wght@600;700;800&display=swap">
<style>
/* Night "voice field" theme: sky background, coral = problems, mint = actions, amber = warnings. RTL. */
:root{
  --bg:#0C1124; --sky2:#111830; --sky3:#22305A;
  --panel:#141C36; --panel2:#1B2546; --line:#2A3760; --fg:#EEF2FB; --mut:#9FB0D0;
  --acc:#6FD6A8; --accd:#123A30; --bad:#FF7A5C; --badbg:#3A1F1A; --ok:#6FD6A8; --okbg:#123A30;
  --warn:#F5C26B; --warnbg:#3A2E16; --info:#9DB8FF; --infobg:#1C2850;
  --dot:#4E5D85; --hollow:#46557C; --coral:#FF7A5C; --mint:#6FD6A8;
  --fb:'IBM Plex Sans Arabic','Segoe UI',Tahoma,Arial,sans-serif; --fh:'Alexandria','IBM Plex Sans Arabic','Segoe UI',Tahoma,Arial,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:radial-gradient(120% 70% at 85% 0%,var(--sky3) 0%,var(--sky2) 45%,var(--bg) 100%) fixed,var(--bg);color:var(--fg);font-family:var(--fb);font-size:15px;line-height:1.7;
  padding-block:0 72px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:60}
h1,h2,h3,h4{font-family:var(--fh);margin:0;font-weight:600;text-wrap:balance}
p{margin:0}
button,select,input,textarea{font:inherit;color:inherit}
button:focus-visible,select:focus-visible,input:focus-visible,textarea:focus-visible,a:focus-visible,summary:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
a{color:var(--acc)}
.wrap{max-width:980px;margin:0 auto}
.top{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;padding:22px 0 8px}
.brand{display:flex;gap:12px;align-items:center;min-width:0}
.logo{width:44px;height:44px;border-radius:12px;background:var(--coral);color:#1A0E08;display:grid;place-items:center;font:600 20px var(--fh);flex:none}
.brand h1{font-size:22px;line-height:1.3}
.brand p{color:var(--mut);font-size:13px}
.btn{cursor:pointer;border:1px solid var(--line);background:var(--panel2);border-radius:10px;padding:8px 16px;line-height:1.4}
.btn:hover{border-color:var(--acc)}
.btn.pri{background:var(--acc);border-color:var(--acc);color:#04222A;font-weight:600}
.btn.sm{padding:4px 11px;font-size:13px;border-radius:8px}
.btn.on{background:var(--accd);border-color:var(--acc);color:var(--acc)}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.statusbar{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;font-size:13px;color:var(--mut);padding:6px 0 2px}
.statusbar b{color:var(--fg);font-weight:500}
.chip{display:inline-block;font-size:12.5px;line-height:1.5;padding:1px 10px;border-radius:99px;background:var(--infobg);color:var(--info);white-space:nowrap}
.chip.bad{background:var(--badbg);color:var(--bad)}.chip.ok{background:var(--okbg);color:var(--ok)}.chip.warn{background:var(--warnbg);color:var(--warn)}.chip.mut{background:var(--panel2);color:var(--mut)}
.evname{background:var(--accd);color:var(--acc);border:1px solid var(--acc);border-radius:8px;padding:2px 12px;font-weight:700;font-size:15px}
.src{display:flex;justify-content:space-between;gap:10px;align-items:center;border-top:1px solid var(--line);padding:8px 0;flex-wrap:wrap}
.src .n{font-variant-numeric:tabular-nums;font-weight:600}
.soon{border:1px dashed var(--line);background:transparent;opacity:.85}
.soon .it{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;border-top:1px dashed var(--line);padding:8px 0}
.soon .it:first-of-type{border-top:0}
.soon .it b{font-weight:500;color:var(--mut)}
.pillsoon{background:var(--panel2);color:var(--mut);border:1px solid var(--line);border-radius:8px;padding:1px 10px;font-size:12px;white-space:nowrap}
.sb{display:flex;height:9px;border-radius:6px;overflow:hidden;background:var(--panel2);min-width:90px}
.sb i{display:block;height:100%}.sb .p{background:var(--ok)}.sb .u{background:var(--mut)}.sb .g{background:var(--bad)}
.demo-flag{background:var(--warnbg);color:var(--warn);border:1px solid #6b5520;border-radius:8px;padding:1px 10px;font-weight:600;font-size:12.5px}
.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0 4px}
.tab{cursor:pointer;border:1px solid var(--line);background:var(--panel);border-radius:12px;padding:10px 14px;text-align:right;display:flex;gap:10px;align-items:center}
.tab .n{width:26px;height:26px;border-radius:50%;background:var(--panel2);display:grid;place-items:center;font:600 13px var(--fh);flex:none}
.tab.on{border-color:var(--acc);background:var(--accd)}
.tab.on .n{background:var(--acc);color:#04222A}
.filters{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:end;padding:12px 0 4px}
.fld{display:flex;flex-direction:column;gap:3px;font-size:12.5px;color:var(--mut);min-width:0}
.fld select,.fld input[type=text]{background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:6px 10px;min-width:150px;max-width:100%}
.panel{display:none;padding-top:14px}
.panel.on{display:block}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px 18px;min-width:0}
.card h3{font-size:16px;margin-bottom:10px}
.grid{display:grid;gap:12px}
.g2{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(270px,1fr))}
.stack{display:flex;flex-direction:column;gap:12px}
.hero{background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid var(--line);border-radius:16px;padding:20px 22px}
.hero h2{font-size:24px;line-height:1.5;margin:6px 0}
.hero .sub{color:var(--mut)}
.small{font-size:12.5px;color:var(--mut)}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.sec{font-size:19px;margin:22px 0 4px;font-family:var(--fh)}
.secp{color:var(--mut);font-size:13.5px;margin-bottom:10px;max-width:72ch}
.rw{display:grid;grid-template-columns:minmax(110px,1.1fr) 1.4fr auto;gap:6px 12px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.rw:first-of-type{border-top:0}
.rw .l b{font-weight:500}
.rw .l small{display:block;color:var(--mut);font-size:12px}
.bar{height:8px;border-radius:99px;background:var(--panel2);overflow:hidden}
.bar i{display:block;height:100%;background:var(--bad);border-radius:99px}
.bar.g i{background:var(--ok)}
.rw .v{text-align:left;font-variant-numeric:tabular-nums;white-space:nowrap}
.rw .v small{display:block;color:var(--mut);font-size:11.5px}
.rw .x{grid-column:1/-1;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.stages{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:8px}
.stg{background:var(--panel2);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:6px}
.stg b{font-size:14px;font-weight:500}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--panel)}
table{width:100%;border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums}
th,td{padding:9px 12px;text-align:right;border-top:1px solid var(--line);vertical-align:top}
th{border-top:0;color:var(--mut);font-weight:500;font-size:12.5px;white-space:nowrap}
tr.cur td{background:rgba(92,203,221,.06)}
td small{display:block;color:var(--mut);font-size:11.5px}
.rec{display:flex;flex-direction:column;gap:10px}
.rec h3{font-size:17px;margin:0}
.rec .rh{display:flex;gap:10px;align-items:flex-start}
.rank{flex:none;width:30px;height:30px;border-radius:50%;background:var(--accd);color:var(--acc);display:grid;place-items:center;font:600 14px var(--fh)}
.kv{display:grid;grid-template-columns:150px 1fr;gap:8px 14px;font-size:14.5px}
.kv dt{color:var(--mut)}.kv dd{margin:0}
.note{background:var(--infobg);color:#C9D8FF;border-radius:10px;padding:9px 13px;font-size:13.5px}
.note.warn{background:var(--warnbg);color:#F6DFA6}.note.bad{background:var(--badbg);color:#F8C3B8}
.empty{color:var(--mut);padding:18px;text-align:center;border:1px dashed var(--line);border-radius:12px}
.drop{display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center;border:2px dashed var(--line);border-radius:14px;padding:22px 14px;cursor:pointer;background:var(--panel2)}
.drop:hover{border-color:var(--acc)}
.drop input{position:absolute;opacity:0;width:1px;height:1px}
.drop:focus-within{outline:2px solid var(--acc);outline-offset:2px}
.drop b{font-size:16px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{border:0;background:var(--panel2);padding:8px 16px;cursor:pointer}
.seg button.on{background:var(--acc);color:#04222A;font-weight:600}
textarea,input[type=text],input[type=date]{width:100%;background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:7px 10px}
textarea{min-height:86px;resize:vertical}
details{margin-top:10px}
summary{cursor:pointer;color:var(--mut);font-size:13.5px}
label.chk{display:flex;gap:8px;align-items:center;font-size:13.5px}
.chartbox{direction:ltr;overflow-x:auto}
.chartbox svg{display:block;width:100%;min-width:520px;height:auto}
.gx{stroke:var(--line);stroke-width:1}.gt{fill:var(--mut);font-size:11px;font-family:var(--fb)}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12.5px;color:var(--mut)}
.legend i{display:inline-block;width:18px;height:3px;border-radius:2px;vertical-align:middle;margin-inline-end:6px}
.legend i.sq{width:12px;height:12px;border-radius:3px}
.chartbox.pc svg{min-width:0;max-width:560px;margin:0 auto}
.pbc{display:flex;flex-direction:column;gap:6px}
.pbr{display:grid;grid-template-columns:150px 1fr;gap:10px;align-items:center}
.pbr .l small{display:block;color:var(--mut);font-size:12px}
.sbx{display:flex;height:30px;border-radius:8px;overflow:hidden;background:var(--panel2)}
.sbx i{display:flex;align-items:center;justify-content:center;font-style:normal;font-size:12.5px;font-weight:700;color:#0B1220;white-space:nowrap;overflow:hidden}
.sbx .p{background:var(--ok)}.sbx .u{background:var(--mut)}.sbx .g{background:var(--bad)}
@media (max-width:640px){.pbr{grid-template-columns:1fr;gap:4px}}
.log{max-height:240px;overflow:auto;font-size:13px;display:flex;flex-direction:column;gap:2px}
.log div{display:flex;gap:10px;padding:3px 0;border-top:1px solid var(--line)}
.log time{color:var(--mut);flex:none;font-size:12px}
.log .e{color:var(--bad)}.log .q{color:var(--acc)}.log .x{color:var(--warn)}
.big{font:600 30px/1.2 var(--fh);font-variant-numeric:tabular-nums}
.stat{display:flex;flex-direction:column;gap:2px}
.stat .lb{color:var(--mut);font-size:13px}
.pill{display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center}
.steps{margin:0;padding-inline-start:20px;display:flex;flex-direction:column;gap:4px}
.tip{display:flex;gap:10px;align-items:flex-start}
.tip i{flex:none;width:8px;height:8px;border-radius:50%;background:var(--warn);margin-top:9px}
.tip.ok i{background:var(--ok)}
.nextbar{display:flex;justify-content:space-between;gap:10px;margin-top:22px}
.scrim{position:fixed;inset:0;background:rgba(2,6,14,.6);z-index:70;display:none}
.scrim.on{display:block}
.drawer{position:fixed;top:0;bottom:0;left:0;width:min(520px,100%);background:var(--panel);border-right:1px solid var(--line);z-index:80;transform:translateX(-102%);transition:transform .22s ease;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
.drawer.on{transform:none}
.dh{display:flex;justify-content:space-between;gap:10px;padding:16px 18px;border-bottom:1px solid var(--line)}
.dh h3{font-size:16px}
.db{overflow:auto;padding:14px 18px 40px;display:flex;flex-direction:column;gap:10px}
.ev{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.ev .tx{font-size:14.5px;overflow-wrap:anywhere}
.ev .tx.en{direction:ltr;text-align:left}
.ev select{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:2px 4px;font-size:12px}
.toast{position:fixed;bottom:max(18px,env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--panel2);border:1px solid var(--acc);border-radius:12px;padding:10px 16px;z-index:100;max-width:min(92vw,520px);display:none}
.toast.on{display:block}

.hbtns{display:flex;flex-wrap:wrap;gap:8px}
a.btn{text-decoration:none;color:var(--fg);display:inline-block}
a.btn:hover{color:var(--fg)}
.kw{justify-content:space-between;border-top:1px solid var(--line);padding-top:6px}
.kw b{font-weight:500;overflow-wrap:anywhere}
.wl{display:flex;flex-direction:column;gap:8px;max-height:440px;overflow:auto;margin-top:10px;padding-inline-end:2px}
.wr{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:8px 12px;display:flex;flex-direction:column;gap:5px}
.wr .tx{font-size:13.5px;overflow-wrap:anywhere}
.wr .tx.en{direction:ltr;text-align:left}
/* chat assistant */
.chat{position:fixed;top:0;bottom:0;left:0;width:380px;z-index:55;background:var(--panel);border-right:1px solid var(--line);display:none;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
.chat.on{display:flex}
.ch{display:flex;justify-content:space-between;gap:8px;align-items:flex-start;padding:14px 16px;border-bottom:1px solid var(--line)}
.ch b{font-family:var(--fh);font-size:16px}
.cm{flex:1;overflow:auto;padding:14px 14px 6px;display:flex;flex-direction:column;gap:10px;min-height:0}
.m{max-width:94%;border-radius:14px;padding:9px 12px;font-size:13.5px;line-height:1.7;overflow-wrap:anywhere}
.m.u{align-self:flex-start;background:var(--accd);color:#D8F6FB}
.m.a{align-self:stretch;max-width:100%;background:var(--panel2);border:1px solid var(--line)}
.m details{font-size:12px;color:var(--mut);margin:0 0 6px}.m summary{cursor:pointer}.m details ul{margin:4px 0 0;padding-inline-start:18px}
.m .body div{margin:4px 0}.m .body ul{margin:4px 0;padding-inline-start:18px}.m .acts{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.m hr.cl{border:0;border-top:1px solid var(--line);margin:10px 0}
.cq{margin:4px 0;padding-inline-start:10px;border-inline-start:3px solid var(--line);color:#C6D3E8;font-size:12.5px}
.cc{display:flex;flex-wrap:wrap;gap:6px;padding:6px 14px}
.chipb{cursor:pointer;border:1px solid var(--line);background:var(--panel2);color:var(--fg);border-radius:99px;padding:3px 11px;font-size:12.5px}
.chipb:hover{border-color:var(--acc)}
.cf{display:flex;gap:8px;padding:10px 14px calc(10px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line)}
.cf input{flex:1;min-width:0}
.chat-fab{position:fixed;left:max(16px,env(safe-area-inset-left,0px));bottom:max(16px,env(safe-area-inset-bottom,0px));z-index:50;cursor:pointer;border:0;border-radius:99px;background:var(--acc);color:#04222A;font-weight:600;padding:11px 18px;box-shadow:0 6px 20px rgba(0,0,0,.4)}
body.chat-open .chat-fab{display:none}
@media (min-width:1000px){body.chat-open{padding-left:400px}}
@media (max-width:999px){.chat{inset:0;width:auto;z-index:75;border-right:0}}
/* report preview */
.pv{position:fixed;inset:0;z-index:95;background:#050912;display:none;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
.pv.on{display:flex}
.pvh{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap;padding:12px 16px;background:var(--panel);border-bottom:1px solid var(--line)}
.pvh b{font-family:var(--fh);font-size:16px}
.pvb{flex:1;overflow:auto;padding:18px 12px 48px;display:flex;flex-direction:column;align-items:center;gap:16px;min-height:0}
.pvb img{display:block;width:min(794px,100%);height:auto;background:#fff;border-radius:4px;box-shadow:0 10px 30px rgba(0,0,0,.5)}
.pvb .ld{color:var(--mut);padding:60px 10px;text-align:center}
.pvb .pn{color:var(--mut);font-size:12px;margin-top:-10px}
body.pv-open{overflow:hidden}
@media (max-width:640px){.kv{grid-template-columns:1fr;gap:0}.kv dt{font-size:12.5px;margin-top:8px}.tab{flex-direction:column;gap:4px;padding:8px 4px;text-align:center;font-size:13.5px}.top{padding-top:14px}.hero h2{font-size:20px}.rw{grid-template-columns:1fr auto}.rw .bar{grid-column:1/-1;order:3}.brand h1{font-size:19px}.fld select{min-width:0;width:100%}.fld{flex:1 1 140px}}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}.drawer{transition:none}}

/* ---------- voice field hero ---------- */
.vf{background:linear-gradient(160deg,rgba(255,255,255,.06),rgba(255,255,255,.02));border:1px solid rgba(255,255,255,.11);border-radius:20px;padding:20px 22px;display:grid;gap:16px}
.vf-h{font-family:var(--fh);font-weight:800;font-size:clamp(22px,3.4vw,32px);line-height:1.35;margin:0}
.vf-h em{font-style:normal;color:var(--coral)}
.vf-sub{color:var(--mut);font-size:14.5px;margin-top:2px}
.vf-chips{display:flex;gap:8px;flex-wrap:wrap}
.vf-chips button{cursor:pointer;font-size:13.5px;border-radius:999px;border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.05);padding:5px 14px}
.vf-chips button[aria-pressed="true"]{background:var(--coral);border-color:var(--coral);color:#1A0E08;font-weight:700}
.vf-main{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:820px){.vf-main{grid-template-columns:1fr}}
.field{display:grid;grid-template-columns:repeat(24,minmax(0,1fr));gap:5px;direction:ltr}
@media (max-width:560px){.field{grid-template-columns:repeat(16,minmax(0,1fr));gap:4px}}
.field button{all:unset;cursor:pointer;aspect-ratio:1;border-radius:50%;background:var(--dot);transition:transform .45s cubic-bezier(.2,.8,.2,1),background .3s,box-shadow .3s}
.field button.h{background:transparent;box-shadow:inset 0 0 0 1.5px var(--hollow)}
.field button.on{background:var(--coral);transform:scale(1.55);box-shadow:0 0 12px 2px rgba(255,122,92,.5)}
.field button.ask{background:var(--mint);transform:scale(1.55);box-shadow:0 0 12px 2px rgba(111,214,168,.5)}
.field button:focus-visible{outline:2px solid var(--mint);outline-offset:2px}
@media (prefers-reduced-motion:reduce){.field button{transition:none}}
.vf-leg{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--mut);margin-top:10px}
.vf-leg i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-inline-end:6px;vertical-align:-1px}
.vf-card{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.11);border-radius:16px;padding:16px;display:grid;gap:10px;align-content:start}
.vf-n{font-family:var(--fh);font-size:44px;font-weight:800;color:var(--coral);line-height:1}
.vf-n small{font-size:14px;color:var(--mut);font-family:var(--fb);font-weight:500}
.vf-act{font-family:var(--fh);font-size:18px;font-weight:700;line-height:1.5}
.vf-facts{display:flex;gap:6px;flex-wrap:wrap}
.vf-facts span{font-size:12.5px;background:rgba(255,255,255,.07);border-radius:999px;padding:2px 10px;white-space:nowrap}
.vf-btns{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.btn.coral{background:var(--coral);border-color:var(--coral);color:#1A0E08;font-weight:700}
.fixb{cursor:pointer;font-size:12px;border-radius:8px;border:1px solid var(--warn);background:transparent;color:var(--warn);padding:1px 9px}
</style>

<div class="wrap" id="app" dir="rtl" lang="ar">
  <header class="top">
    <div class="brand"><div class="logo">م</div><div><h1>مستشار الفعالية</h1><p id="brandSub">فريق beyond limits</p></div></div>
    <div class="hbtns"><button class="btn" id="btnChat" type="button">اسألوا المساعد</button><button class="btn pri" id="btnPdf" type="button">عرض التقرير (PDF)</button></div>
  </header>
