<title>مستشار الفعالية</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=Readex+Pro:wght@500;600&display=swap">
<style>
/* Simple three-step layout: 1 data (status + files) -> 2 what happened -> 3 recommendations + PDF report. Dark, RTL. */
:root{
  --bg:#0B1220; --panel:#111C30; --panel2:#17263F; --line:#223552; --fg:#E8EEF8; --mut:#93A6C4;
  --acc:#5CCBDD; --accd:#10404B; --bad:#F2917F; --badbg:#3A2422; --ok:#74D8A4; --okbg:#143027;
  --warn:#F1C566; --warnbg:#392F16; --info:#86A9FF; --infobg:#1A2745;
  --fb:'IBM Plex Sans Arabic','Segoe UI',Tahoma,Arial,sans-serif; --fh:'Readex Pro','IBM Plex Sans Arabic','Segoe UI',Tahoma,Arial,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--fb);font-size:15px;line-height:1.7;
  padding-block:0 72px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:60}
h1,h2,h3,h4{font-family:var(--fh);margin:0;font-weight:600;text-wrap:balance}
p{margin:0}
button,select,input,textarea{font:inherit;color:inherit}
button:focus-visible,select:focus-visible,input:focus-visible,textarea:focus-visible,a:focus-visible,summary:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
a{color:var(--acc)}
.wrap{max-width:980px;margin:0 auto}
.top{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;padding:22px 0 8px}
.brand{display:flex;gap:12px;align-items:center;min-width:0}
.logo{width:44px;height:44px;border-radius:12px;background:var(--accd);color:var(--acc);display:grid;place-items:center;font:600 20px var(--fh);flex:none}
.brand h1{font-size:22px;line-height:1.3}
.brand p{color:var(--mut);font-size:13px}
.btn{cursor:pointer;border:1px solid var(--line);background:var(--panel2);border-radius:10px;padding:8px 16px;line-height:1.4}
.btn:hover{border-color:var(--acc)}
.btn.pri{background:var(--acc);border-color:var(--acc);color:#04222A;font-weight:600}
.btn.sm{padding:4px 11px;font-size:13px;border-radius:8px}
.btn.on{background:var(--accd);border-color:var(--acc);color:var(--acc)}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.statusbar{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;font-size:13px;color:var(--mut);padding:6px 0 2px}
.statusbar b{color:var(--fg);font-weight:500}
.chip{display:inline-block;font-size:12.5px;line-height:1.5;padding:1px 10px;border-radius:99px;background:var(--infobg);color:var(--info);white-space:nowrap}
.chip.bad{background:var(--badbg);color:var(--bad)}.chip.ok{background:var(--okbg);color:var(--ok)}.chip.warn{background:var(--warnbg);color:var(--warn)}.chip.mut{background:var(--panel2);color:var(--mut)}
.evname{background:var(--accd);color:var(--acc);border:1px solid var(--acc);border-radius:8px;padding:2px 12px;font-weight:700;font-size:15px}
.src{display:flex;justify-content:space-between;gap:10px;align-items:center;border-top:1px solid var(--line);padding:8px 0;flex-wrap:wrap}
.src .n{font-variant-numeric:tabular-nums;font-weight:600}
.soon{border:1px dashed var(--line);background:transparent;opacity:.85}
.soon .it{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;border-top:1px dashed var(--line);padding:8px 0}
.soon .it:first-of-type{border-top:0}
.soon .it b{font-weight:500;color:var(--mut)}
.pillsoon{background:var(--panel2);color:var(--mut);border:1px solid var(--line);border-radius:8px;padding:1px 10px;font-size:12px;white-space:nowrap}
.sb{display:flex;height:9px;border-radius:6px;overflow:hidden;background:var(--panel2);min-width:90px}
.sb i{display:block;height:100%}.sb .p{background:var(--ok)}.sb .u{background:var(--mut)}.sb .g{background:var(--bad)}
.demo-flag{background:var(--warnbg);color:var(--warn);border:1px solid #6b5520;border-radius:8px;padding:1px 10px;font-weight:600;font-size:12.5px}
.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0 4px}
.tab{cursor:pointer;border:1px solid var(--line);background:var(--panel);border-radius:12px;padding:10px 14px;text-align:right;display:flex;gap:10px;align-items:center}
.tab .n{width:26px;height:26px;border-radius:50%;background:var(--panel2);display:grid;place-items:center;font:600 13px var(--fh);flex:none}
.tab.on{border-color:var(--acc);background:var(--accd)}
.tab.on .n{background:var(--acc);color:#04222A}
.filters{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:end;padding:12px 0 4px}
.fld{display:flex;flex-direction:column;gap:3px;font-size:12.5px;color:var(--mut);min-width:0}
.fld select,.fld input[type=text]{background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:6px 10px;min-width:150px;max-width:100%}
.panel{display:none;padding-top:14px}
.panel.on{display:block}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px 18px;min-width:0}
.card h3{font-size:16px;margin-bottom:10px}
.grid{display:grid;gap:12px}
.g2{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(270px,1fr))}
.stack{display:flex;flex-direction:column;gap:12px}
.hero{background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid var(--line);border-radius:16px;padding:20px 22px}
.hero h2{font-size:24px;line-height:1.5;margin:6px 0}
.hero .sub{color:var(--mut)}
.small{font-size:12.5px;color:var(--mut)}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.sec{font-size:19px;margin:22px 0 4px;font-family:var(--fh)}
.secp{color:var(--mut);font-size:13.5px;margin-bottom:10px;max-width:72ch}
.rw{display:grid;grid-template-columns:minmax(110px,1.1fr) 1.4fr auto;gap:6px 12px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.rw:first-of-type{border-top:0}
.rw .l b{font-weight:500}
.rw .l small{display:block;color:var(--mut);font-size:12px}
.bar{height:8px;border-radius:99px;background:var(--panel2);overflow:hidden}
.bar i{display:block;height:100%;background:var(--bad);border-radius:99px}
.bar.g i{background:var(--ok)}
.rw .v{text-align:left;font-variant-numeric:tabular-nums;white-space:nowrap}
.rw .v small{display:block;color:var(--mut);font-size:11.5px}
.rw .x{grid-column:1/-1;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.stages{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:8px}
.stg{background:var(--panel2);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:6px}
.stg b{font-size:14px;font-weight:500}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--panel)}
table{width:100%;border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums}
th,td{padding:9px 12px;text-align:right;border-top:1px solid var(--line);vertical-align:top}
th{border-top:0;color:var(--mut);font-weight:500;font-size:12.5px;white-space:nowrap}
tr.cur td{background:rgba(92,203,221,.06)}
td small{display:block;color:var(--mut);font-size:11.5px}
.rec{display:flex;flex-direction:column;gap:10px}
.rec h3{font-size:17px;margin:0}
.rec .rh{display:flex;gap:10px;align-items:flex-start}
.rank{flex:none;width:30px;height:30px;border-radius:50%;background:var(--accd);color:var(--acc);display:grid;place-items:center;font:600 14px var(--fh)}
.kv{display:grid;grid-template-columns:150px 1fr;gap:8px 14px;font-size:14.5px}
.kv dt{color:var(--mut)}.kv dd{margin:0}
.note{background:var(--infobg);color:#C9D8FF;border-radius:10px;padding:9px 13px;font-size:13.5px}
.note.warn{background:var(--warnbg);color:#F6DFA6}.note.bad{background:var(--badbg);color:#F8C3B8}
.empty{color:var(--mut);padding:18px;text-align:center;border:1px dashed var(--line);border-radius:12px}
.drop{display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center;border:2px dashed var(--line);border-radius:14px;padding:22px 14px;cursor:pointer;background:var(--panel2)}
.drop:hover{border-color:var(--acc)}
.drop input{position:absolute;opacity:0;width:1px;height:1px}
.drop:focus-within{outline:2px solid var(--acc);outline-offset:2px}
.drop b{font-size:16px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{border:0;background:var(--panel2);padding:8px 16px;cursor:pointer}
.seg button.on{background:var(--acc);color:#04222A;font-weight:600}
textarea,input[type=text],input[type=date]{width:100%;background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:7px 10px}
textarea{min-height:86px;resize:vertical}
details{margin-top:10px}
summary{cursor:pointer;color:var(--mut);font-size:13.5px}
label.chk{display:flex;gap:8px;align-items:center;font-size:13.5px}
.chartbox{direction:ltr;overflow-x:auto}
.chartbox svg{display:block;width:100%;min-width:520px;height:auto}
.gx{stroke:var(--line);stroke-width:1}.gt{fill:var(--mut);font-size:11px;font-family:var(--fb)}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12.5px;color:var(--mut)}
.legend i{display:inline-block;width:18px;height:3px;border-radius:2px;vertical-align:middle;margin-inline-end:6px}
.legend i.sq{width:12px;height:12px;border-radius:3px}
.chartbox.pc svg{min-width:0;max-width:560px;margin:0 auto}
.pbc{display:flex;flex-direction:column;gap:6px}
.pbr{display:grid;grid-template-columns:150px 1fr;gap:10px;align-items:center}
.pbr .l small{display:block;color:var(--mut);font-size:12px}
.sbx{display:flex;height:30px;border-radius:8px;overflow:hidden;background:var(--panel2)}
.sbx i{display:flex;align-items:center;justify-content:center;font-style:normal;font-size:12.5px;font-weight:700;color:#0B1220;white-space:nowrap;overflow:hidden}
.sbx .p{background:var(--ok)}.sbx .u{background:var(--mut)}.sbx .g{background:var(--bad)}
@media (max-width:640px){.pbr{grid-template-columns:1fr;gap:4px}}
.log{max-height:240px;overflow:auto;font-size:13px;display:flex;flex-direction:column;gap:2px}
.log div{display:flex;gap:10px;padding:3px 0;border-top:1px solid var(--line)}
.log time{color:var(--mut);flex:none;font-size:12px}
.log .e{color:var(--bad)}.log .q{color:var(--acc)}.log .x{color:var(--warn)}
.big{font:600 30px/1.2 var(--fh);font-variant-numeric:tabular-nums}
.stat{display:flex;flex-direction:column;gap:2px}
.stat .lb{color:var(--mut);font-size:13px}
.pill{display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center}
.steps{margin:0;padding-inline-start:20px;display:flex;flex-direction:column;gap:4px}
.tip{display:flex;gap:10px;align-items:flex-start}
.tip i{flex:none;width:8px;height:8px;border-radius:50%;background:var(--warn);margin-top:9px}
.tip.ok i{background:var(--ok)}
.nextbar{display:flex;justify-content:space-between;gap:10px;margin-top:22px}
.scrim{position:fixed;inset:0;background:rgba(2,6,14,.6);z-index:70;display:none}
.scrim.on{display:block}
.drawer{position:fixed;top:0;bottom:0;left:0;width:min(520px,100%);background:var(--panel);border-right:1px solid var(--line);z-index:80;transform:translateX(-102%);transition:transform .22s ease;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
.drawer.on{transform:none}
.dh{display:flex;justify-content:space-between;gap:10px;padding:16px 18px;border-bottom:1px solid var(--line)}
.dh h3{font-size:16px}
.db{overflow:auto;padding:14px 18px 40px;display:flex;flex-direction:column;gap:10px}
.ev{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.ev .tx{font-size:14.5px;overflow-wrap:anywhere}
.ev .tx.en{direction:ltr;text-align:left}
.ev select{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:2px 4px;font-size:12px}
.toast{position:fixed;bottom:max(18px,env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--panel2);border:1px solid var(--acc);border-radius:12px;padding:10px 16px;z-index:100;max-width:min(92vw,520px);display:none}
.toast.on{display:block}

.hbtns{display:flex;flex-wrap:wrap;gap:8px}
a.btn{text-decoration:none;color:var(--fg);display:inline-block}
a.btn:hover{color:var(--fg)}
.kw{justify-content:space-between;border-top:1px solid var(--line);padding-top:6px}
.kw b{font-weight:500;overflow-wrap:anywhere}
.wl{display:flex;flex-direction:column;gap:8px;max-height:440px;overflow:auto;margin-top:10px;padding-inline-end:2px}
.wr{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:8px 12px;display:flex;flex-direction:column;gap:5px}
.wr .tx{font-size:13.5px;overflow-wrap:anywhere}
.wr .tx.en{direction:ltr;text-align:left}
/* chat assistant */
.chat{position:fixed;top:0;bottom:0;left:0;width:380px;z-index:55;background:var(--panel);border-right:1px solid var(--line);display:none;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
.chat.on{display:flex}
.ch{display:flex;justify-content:space-between;gap:8px;align-items:flex-start;padding:14px 16px;border-bottom:1px solid var(--line)}
.ch b{font-family:var(--fh);font-size:16px}
.cm{flex:1;overflow:auto;padding:14px 14px 6px;display:flex;flex-direction:column;gap:10px;min-height:0}
.m{max-width:94%;border-radius:14px;padding:9px 12px;font-size:13.5px;line-height:1.7;overflow-wrap:anywhere}
.m.u{align-self:flex-start;background:var(--accd);color:#D8F6FB}
.m.a{align-self:stretch;max-width:100%;background:var(--panel2);border:1px solid var(--line)}
.m details{font-size:12px;color:var(--mut);margin:0 0 6px}.m summary{cursor:pointer}.m details ul{margin:4px 0 0;padding-inline-start:18px}
.m .body div{margin:4px 0}.m .body ul{margin:4px 0;padding-inline-start:18px}.m .acts{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.m hr.cl{border:0;border-top:1px solid var(--line);margin:10px 0}
.cq{margin:4px 0;padding-inline-start:10px;border-inline-start:3px solid var(--line);color:#C6D3E8;font-size:12.5px}
.cc{display:flex;flex-wrap:wrap;gap:6px;padding:6px 14px}
.chipb{cursor:pointer;border:1px solid var(--line);background:var(--panel2);color:var(--fg);border-radius:99px;padding:3px 11px;font-size:12.5px}
.chipb:hover{border-color:var(--acc)}
.cf{display:flex;gap:8px;padding:10px 14px calc(10px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line)}
.cf input{flex:1;min-width:0}
.chat-fab{position:fixed;left:max(16px,env(safe-area-inset-left,0px));bottom:max(16px,env(safe-area-inset-bottom,0px));z-index:50;cursor:pointer;border:0;border-radius:99px;background:var(--acc);color:#04222A;font-weight:600;padding:11px 18px;box-shadow:0 6px 20px rgba(0,0,0,.4)}
body.chat-open .chat-fab{display:none}
@media (min-width:1000px){body.chat-open{padding-left:400px}}
@media (max-width:999px){.chat{inset:0;width:auto;z-index:75;border-right:0}}
/* report preview */
.pv{position:fixed;inset:0;z-index:95;background:#050912;display:none;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
.pv.on{display:flex}
.pvh{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap;padding:12px 16px;background:var(--panel);border-bottom:1px solid var(--line)}
.pvh b{font-family:var(--fh);font-size:16px}
.pvb{flex:1;overflow:auto;padding:18px 12px 48px;display:flex;flex-direction:column;align-items:center;gap:16px;min-height:0}
.pvb img{display:block;width:min(794px,100%);height:auto;background:#fff;border-radius:4px;box-shadow:0 10px 30px rgba(0,0,0,.5)}
.pvb .ld{color:var(--mut);padding:60px 10px;text-align:center}
.pvb .pn{color:var(--mut);font-size:12px;margin-top:-10px}
body.pv-open{overflow:hidden}
@media (max-width:640px){.kv{grid-template-columns:1fr;gap:0}.kv dt{font-size:12.5px;margin-top:8px}.tab{flex-direction:column;gap:4px;padding:8px 4px;text-align:center;font-size:13.5px}.top{padding-top:14px}.hero h2{font-size:20px}.rw{grid-template-columns:1fr auto}.rw .bar{grid-column:1/-1;order:3}.brand h1{font-size:19px}.fld select{min-width:0;width:100%}.fld{flex:1 1 140px}}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}.drawer{transition:none}}
</style>

<div class="wrap" id="app" dir="rtl" lang="ar">
  <header class="top">
    <div class="brand"><div class="logo">م</div><div><h1>مستشار الفعالية</h1><p id="brandSub">فريق beyond limits</p></div></div>
    <div class="hbtns"><button class="btn" id="btnChat" type="button">اسألوا المساعد</button><button class="btn pri" id="btnPdf" type="button">عرض التقرير (PDF)</button></div>
  </header>
  <div class="statusbar" id="status"></div>
  <nav class="tabs" id="tabs">
    <button class="tab" type="button" data-tab="data"><span class="n">١</span><span>البيانات</span></button>
    <button class="tab" type="button" data-tab="happened"><span class="n">٢</span><span>ماذا حصل؟</span></button>
    <button class="tab" type="button" data-tab="recs"><span class="n">٣</span><span>التوصيات</span></button>
  </nav>
  <div class="filters" id="filters"></div>
  <section class="panel" id="p-data"></section>
  <section class="panel" id="p-happened"></section>
  <section class="panel" id="p-recs"></section>
</div>
<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer" dir="rtl" aria-label="أمثلة من الآراء"></aside>
<aside class="chat" id="chat" dir="rtl" aria-label="مساعد المنظّم">
  <div class="ch"><div><b>مساعد المنظّم</b><div class="small" id="chatScope"></div></div><button class="btn sm" type="button" data-act="chatClose">إغلاق</button></div>
  <div class="cm" id="chatLog" aria-live="polite"></div>
  <div class="cc" id="chatChips"></div>
  <form class="cf" id="chatForm" autocomplete="off"><input type="text" id="chatIn" placeholder="اسألوا عن جانب أو منطقة، أو اطلبوا تقريرًا" aria-label="اكتبوا سؤالكم"><button class="btn pri" type="submit">إرسال</button></form>
</aside>
<button class="chat-fab" id="chatFab" type="button">اسألوا المساعد</button>
<div class="pv" id="pv" dir="rtl" role="dialog" aria-modal="true" aria-labelledby="pvT">
  <div class="pvh"><div><b id="pvT">معاينة التقرير</b><div class="small" id="pvInfo"></div></div><div class="row"><button class="btn pri" type="button" id="pvDl" data-act="pvDl">تنزيل PDF</button><button class="btn" type="button" id="pvClose" data-act="pvClose">إغلاق</button></div></div>
  <div class="pvb" id="pvBody"></div>
</div>
<div class="toast" id="toast" role="status"></div>

<script>
(function(){
'use strict';
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=n=>Number(n).toLocaleString('en-US');
const mAd=n=>n===0?'لا مواد':n===1?'مادة واحدة':n===2?'مادتان':(n>=3&&n<=10)?n+' مواد':fmt(n)+' مادة';
const mq=n=>n===1?'مصدر واحد مستقل':n===2?'مصدران مستقلان':(n>=3&&n<=10)?n+' مصادر مستقلة':fmt(n)+' مصدرًا مستقلًا';
const clone=o=>JSON.parse(JSON.stringify(o));
const dnum=s=>{const p=s.split('-').map(Number);return Date.UTC(p[0],p[1]-1,p[2])/864e5};
const dstr=n=>new Date(n*864e5).toISOString().slice(0,10);
const MON=['يناير','فبراير','مارس','أبريل','مايو','يونيو','يوليو','أغسطس','سبتمبر','أكتوبر','نوفمبر','ديسمبر'];
const dAr=s=>{if(!s)return '—';const p=s.split('-').map(Number);return p[2]+' '+MON[p[1]-1]+' '+p[0]};
const addDays=(s,n)=>dstr(dnum(s)+n);

/* ---------- reference data ---------- */

const POS_L=['يستاهل','حلو','حلين','رهيب','روعة','رائع','ممتع','ممتاز','جميل','أحلى','لذيذ','نظيف','منظم','سلس','سريع','قصير','قليل','معقول','مريح','مرتب','مبدع','إبداع','أفضل','تحسن','واضح','سهل','محترم','great','amazing','love','loved','beautiful','enjoy','enjoyable','improved','excellent','good','nice','fun','worth','clean','smooth','best','wonderful','awesome','delicious','perfect','short','fast','quick','organized','reasonable','cheap','lovely','fantastic','impressive','easy','clear','friendly','respectful'];
const NEG_R=re(NEG_L,'g'),POS_R=re(POS_L,'g');
const NEGW=['ما','مو','غير','لا','not','no','never','without',"isn't","wasn't","don't","didn't","couldn't","won't","wouldn't"].map(word).join('|');

const VIS=re(['رحنا','رحت','زرت','زرنا','جربنا','جربت','رجعت','رجعنا','كنا','كنت','دخلنا','أكلنا','went','visited','tried','been','we were','i was','just got back']);

const RET=re(['ارجع','راجع','رجعنا','بنرجع','بارجع','برجع','come back','go back','will return','visit again','come again','return again','be back']);
const NORET=new RegExp('(?:(?<!['+AB+'])(?:ما|مو|لا)(?!['+AB+'])\\s+(?:'+src(['ارجع','بارجع','برجع','راجع'])+')|won\'t (?:be back|return|come back)|never (?:again|coming back|come back))');
const CHANCE=re(['بالصدفة','صدفة','ما كنا نعرف','ما كنت أعرف','اكتشفنا','اكتشفت','ما درينا','stumbled','by chance',"didn't know",'discovered','hidden gem']);
const CLSPLIT=new RegExp('[.!?؟،,؛;:\\n]+|(?<!['+AB+'])(?:بس|لكن)(?!['+AB+'])|(?<![a-z])(?:but|however|though|although)(?![a-z])');
const cnt=(r,t)=>{r.lastIndex=0;return (t.match(r)||[]).length};
const LOWR=new RegExp('(?<!['+AB+'])قليل(?:ه|ين|ات)?(?!['+AB+'])','g');
const LOWOK=new Set(['wait','crowd','price','vendors']);
function judge(c,a,stars){
 let neg=0,pos=0,t=c;
 if(a!=='wayfinding')t=t.replace(WAYCUE,' ');
 t=t.replace(NEGP,()=>{neg++;return ' '});
 t=t.replace(NEGNEG,()=>{pos++;return ' '});
 pos=cnt(POS_R,t);neg+=cnt(NEG_R,t);
 if(!LOWOK.has(a)){const lw=Math.min(pos,cnt(LOWR,t));pos-=lw;neg+=lw}
 if(ASPECTS[a].defNeg){const ng=NEGASP[a].test(c);if(ng&&!neg)return 'pos';if(!pos&&!neg)return (stars!=null&&stars>=4)?'neu':'neg'}
 if(pos>neg)return 'pos';if(neg>pos)return 'neg';if(pos&&neg)return 'mix';return 'neu';
}
function qTopic(t){
 if(/(بوابه|اوصل|entrance|which gate|how to get|parking|موقف)/.test(t))return 'where';
 if(/(اكل|مطعم|مطاعم|(?<![a-z])eat(?![a-z])|restaurant|food)/.test(t))return 'food';
 if(/(كم|سعر|تذكره|تذاكر|price|how much|ticket)/.test(t))return 'price';
 if(/(جديد|(?<![a-z])new(?![a-z]))/.test(t))return 'new';
 if(/(وين|where)/.test(t))return 'where';
 return 'worth';
}
function classify(text,stars){
 const t=norm(text).replace(/ضيعنا وقتنا/g,'خسرنا وقتنا').replace(/(?<![a-z])(?:it|this|which|that|also|and|he|she|really|clearly)\s+shows(?![a-z])/g,' ');
 const out={aspects:[],intent:'visited',uncertain:false,ret:false,noret:false,chance:false,topic:null,gen:null};
 if(OFFR.test(t)){out.intent='official';return out}
 const isQ=/[؟?]/.test(text)||new RegExp('^(?:وين|كيف|كم|متي|هل|ايش|وش|where|how|when|what|is there)(?![a-z'+AB+'])').test(t);
 if(isQ&&!VIS.test(t)){out.intent='planning';out.topic=qTopic(t);return out}
 const pairs={};
 for(const cl of t.split(CLSPLIT)){const c=cl.trim();if(!c)continue;
  for(const a of AKEYS){if(AK[a].test(c)){(pairs[a]=pairs[a]||[]).push(judge(c,a,stars))}}}
 for(const a in pairs){const ps=pairs[a],s=new Set(ps.filter(x=>x!=='neu'));let p;
  if(s.size>1||ps.includes('mix')){out.uncertain=true;p='mix'}else p=s.size?[...s][0]:'neu';
  if(stars!=null&&stars<=2&&p==='pos')p='neu';
  out.aspects.push({a,p})}
 out.noret=NORET.test(t);out.ret=!out.noret&&RET.test(t);out.chance=CHANCE.test(t);
 const np=(()=>{let n=0,pp=0,t2=t.replace(NEGP,()=>{n++;return ' '}).replace(NEGNEG,()=>{pp++;return ' '});return {pos:cnt(POS_R,t2)+pp,neg:n+cnt(NEG_R,t2)}})();
 out.gen=np.neg>np.pos?'neg':np.pos>np.neg?'pos':null;
 if(!out.aspects.length&&!np.pos&&!np.neg&&!out.ret&&!out.noret)out.uncertain=true;
 return out;
}

function processAll(){

function weeklySeries(){
 const ui=V.ui,ids=V.order.filter(id=>(seasonObj(id)||{}).open);if(!ids.length)return null;
 const pd=periodDays(ui.period),maxItemW=P.items.reduce((m,i)=>Math.max(m,i.week||0),1);
 const maxW=isFinite(pd)?Math.max(1,Math.floor(pd/7)):maxItemW;if(maxW<2)return null;
 const series=ids.map(id=>{
  const its=P.items.filter(i=>i.season===id&&(ui.area==='all'||i.area===ui.area)),pts=[];
  for(let w=1;w<=maxW;w++){const wi=its.filter(i=>i.week===w),st=stats(wi);pts.push({w,v:st.N>=8?st.negAny/st.N*100:null,n:wi.length,N:st.N})}
  return {id,pts};
 });
 return {ids,series,maxW};
}
const CHART_COLS=['#F1C566','#86A9FF','#5CCBDD','#C79BFF'];
function chartSvg(ws){
 const W=720,H=260,pl=44,pr=16,pt=14,pb=44,pw=W-pl-pr,ph=H-pt-pb,maxW=ws.maxW;
 const vals=ws.series.flatMap(s=>s.pts.map(p=>p.v).filter(v=>v!=null));
 const mx=Math.max(...vals,8);const st=[1,2,5,10,20,25,50,100].find(s=>s*4>=mx)||100,ymax=st*4;
 const x=w=>pl+(w-1)*pw/(maxW-1),y=v=>pt+ph*(1-v/ymax);
 let g='';
 for(let k=0;k<=4;k++){const v=ymax*k/4,yy=y(v);g+='<line class="gx" x1="'+pl+'" x2="'+(W-pr)+'" y1="'+yy+'" y2="'+yy+'"/><text class="gt" x="'+(pl-6)+'" y="'+(yy+4)+'" text-anchor="end">'+Math.round(v)+'%</text>'}
 for(let w=1;w<=maxW;w++)g+='<text class="gt" x="'+x(w)+'" y="'+(H-24)+'" text-anchor="middle">'+w+'</text>';
 g+='<text class="gt" x="'+(pl+pw/2)+'" y="'+(H-6)+'" text-anchor="middle">الأسبوع منذ افتتاح كل موسم</text>';
 ws.series.forEach((s,si)=>{
  const col=CHART_COLS[si%CHART_COLS.length],sel=s.id===V.ui.season;let path='',open=false;
  s.pts.forEach(p=>{if(p.v==null){open=false;return}path+=(open?'L':'M')+x(p.w).toFixed(1)+' '+y(p.v).toFixed(1)+' ';open=true});
  if(path)g+='<path d="'+path+'" fill="none" stroke="'+col+'" stroke-width="'+(sel?3.2:2)+'" stroke-linejoin="round" stroke-linecap="round"/>';
  s.pts.forEach(p=>{if(p.v!=null)g+='<circle cx="'+x(p.w)+'" cy="'+y(p.v)+'" r="'+(sel?4:3)+'" fill="'+(p.n>=8?col:'var(--bg)')+'" stroke="'+col+'" stroke-width="2"><title>'+esc(s.id)+' · الأسبوع '+p.w+': '+Math.round(p.v)+'% ('+p.N+' رأيًا)</title></circle>'});
 });
 return '<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="نسبة الشكاوى أسبوعًا بعد أسبوع لكل موسم">'+g+'</svg>';
}
function opn(n){return n===1?'رأي واحد':n===2?'رأيان':fmt(n)+(n<=10?' آراء':' رأيًا')}
function periodChart(rows){
 const pts=rows.filter(o=>o.s.N>0);if(pts.length<2)return '';
 const W=420,H=250,pl=40,pr=10,pt=26,pb=64,pw=W-pl-pr,ph=H-pt-pb,base=pt+ph,gap=pw/pts.length,bw=Math.min(56,gap*.56);
 const vals=pts.map(o=>o.s.negAny/o.s.N*100),mx=Math.max(...vals,8);
 const st=[1,2,5,10,20,25,50,100].find(k=>k*4>=mx)||100,ymax=st*4,y=v=>pt+ph*(1-v/ymax);
 let g='';
 for(let k=0;k<=4;k++){const v=ymax*k/4,yy=y(v);g+='<line class="gx" x1="'+pl+'" x2="'+(W-pr)+'" y1="'+yy+'" y2="'+yy+'"/><text class="gt" x="'+(pl-6)+'" y="'+(yy+4)+'" text-anchor="end">'+Math.round(v)+'%</text>'}
 pts.forEach((o,i)=>{
  const cx=pl+gap*(i+.5),v=vals[i],small=o.s.N<8,top=y(v),sel=o.id===V.ui.season;
  const lbl=String(o.id).replace(/^\d+\s*·\s*/,''),m=lbl.match(/^(\S+)\s+(.+)$/),ln=m?[m[1],m[2]]:[lbl];
  g+='<rect x="'+(cx-bw/2).toFixed(1)+'" y="'+top.toFixed(1)+'" width="'+bw.toFixed(1)+'" height="'+Math.max(1,base-top).toFixed(1)+'" rx="4" '+
   (small?'fill="none" stroke="var(--bad)" stroke-width="2" stroke-dasharray="4 3"':'fill="var(--bad)" fill-opacity="'+(sel?1:.8)+'"'+(sel?' stroke="var(--fg)" stroke-width="2"':''))+
   '><title>'+esc(lbl)+': '+Math.round(v)+'% ('+o.s.negAny+' من '+o.s.N+')'+(small?' · عدد قليل':'')+'</title></rect>'+
   '<text x="'+cx.toFixed(1)+'" y="'+(top-7).toFixed(1)+'" text-anchor="middle" font-size="14" font-weight="700" fill="var(--fg)">'+Math.round(v)+'%</text>'+
   ln.map((t,j)=>'<text x="'+cx.toFixed(1)+'" y="'+(base+17+j*16)+'" text-anchor="middle" font-size="13" fill="var(--fg)">'+esc(t)+'</text>').join('')+
   '<text x="'+cx.toFixed(1)+'" y="'+(base+17+ln.length*16+2)+'" text-anchor="middle" font-size="12" fill="var(--mut)">'+esc(opn(o.s.N))+'</text>';
 });
 const aria='نسبة الزوار الذين اشتكوا من شيء: '+pts.map((o,i)=>String(o.id).replace(/^\d+\s*·\s*/,'')+' '+Math.round(vals[i])+'% من '+o.s.N).join('، ');
 return '<div class="chartbox pc"><svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="'+esc(aria)+'">'+g+'</svg></div>';
}
function platformChart(pl){
 const rows=pl.filter(x=>x.sent&&x.sent.n>0);if(rows.length<2)return '';
 const seg=(cls,k,n)=>{const w=n/k*100;return '<i class="'+cls+'" style="width:'+w.toFixed(1)+'%">'+(w>=11?Math.round(w)+'%':'')+'</i>'};
 return '<div class="pbc">'+rows.map(x=>'<div class="pbr"><div class="l"><b>'+PLAT[x.p]+'</b><small>'+mAd(x.sent.n)+'</small></div>'+
  '<div class="sbx" role="img" aria-label="'+esc(PLAT[x.p]+': إيجابي '+Math.round(x.sent.pos/x.sent.n*100)+'% ومحايد '+Math.round(x.sent.neu/x.sent.n*100)+'% وسلبي '+Math.round(x.sent.neg/x.sent.n*100)+'%')+'">'+seg('p',x.sent.n,x.sent.pos)+seg('u',x.sent.n,x.sent.neu)+seg('g',x.sent.n,x.sent.neg)+'</div></div>').join('')+
  '<div class="legend" style="margin-top:4px"><span><i class="sq" style="background:var(--ok)"></i>إيجابي</span><span><i class="sq" style="background:var(--mut)"></i>محايد</span><span><i class="sq" style="background:var(--bad)"></i>سلبي</span></div></div>';
}

/* ---------- parsing: CSV / JSON / TXT ---------- */
function parseCSV(t){
 t=t.replace(/^﻿/,'');
 const first=t.split(/\r?\n/)[0]||'';const cnt=c=>first.split(c).length-1;
 const delim=cnt('\t')>cnt(',')&&cnt('\t')>cnt(';')?'\t':cnt(';')>cnt(',')?';':',';
 const rows=[];let row=[],f='',q=false;
 for(let i=0;i<t.length;i++){const ch=t[i];
  if(q){if(ch==='"'){if(t[i+1]==='"'){f+='"';i++}else q=false}else f+=ch}
  else if(ch==='"')q=true;else if(ch===delim){row.push(f);f=''}
  else if(ch==='\n'||ch==='\r'){if(ch==='\r'&&t[i+1]==='\n')i++;row.push(f);f='';if(row.some(x=>x!==''))rows.push(row);row=[]}
  else f+=ch}
 row.push(f);if(row.some(x=>x!==''))rows.push(row);
 return rows;
}
const hk=s=>String(s).toLowerCase().replace(/[^a-z0-9؀-ۿ]/g,'');
const COLS={text:['text','content','comment','commenttext','review','reviewtext','body','caption','description','desc','message','نص','النص','التعليق','تعليق','المراجعة','الوصف'],
 id:['id','commentid','cid','rowid'],clip:['clipid','videoid','awemeid','postid','parentid','video'],url:['url','link','videourl','shareurl','الرابط'],
 pub:['publishedat','publishdate','createtime','createdat','date','time','timestamp','posteddate','التاريخ','تاريخالنشر'],coll:['collectedat','scrapedat','fetchedat','تاريخالجمع'],
 season:['season','الموسم'],area:['area','zone','region','المنطقة'],kind:['kind','type','النوع'],official:['official','isad','isofficial','ad','رسمي'],
 reposted:['reposted','isrepost','repost'],query:['query','searchtype'],likes:['likes','diggcount','likecount','إعجابات'],platform:['platform','source','network','channel','منصة','المنصة','مصدر','المصدر'],rating:['rating','stars','star','score','rate','التقييم','تقييم','النجوم','نجوم','عددالنجوم']};
function toDate(v){
 v=String(v==null?'':v).trim();if(!v)return '';
 if(/^\d{9,13}$/.test(v)){const n=Number(v);return new Date(v.length>=12?n:n*1000).toISOString().slice(0,10)}
 let m=v.match(/^(\d{4})-(\d{2})-(\d{2})/);if(m)return m[0];
 m=v.match(/^(\d{1,2})[\/.-](\d{1,2})[\/.-](\d{4})$/);if(m)return m[3]+'-'+m[2].padStart(2,'0')+'-'+m[1].padStart(2,'0');
 const t=Date.parse(v);return isNaN(t)?'':new Date(t).toISOString().slice(0,10);
}
function normPlat(v){
 const t=norm(String(v==null?'':v));if(!t)return '';
 if(/tiktok|تيك|تك توك|تيكتوك/.test(t))return 'tiktok';
 if(/(?<![a-z])x(?![a-z])|twitter|تويتر|اكس|تغريد/.test(t))return 'x';
 if(/google|gmaps|maps|map|قوقل|جوجل|خرايط|خرائط|ماب|review|تقييم/.test(t))return 'gmaps';
 return '';
}
const truthy=v=>/^(1|true|yes|y|نعم)$/i.test(String(v==null?'':v).trim());
function hash(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return (h>>>0).toString(36)}
function matchSeason(v){
 v=String(v||'').trim();if(!v)return '';
 if(S.settings.seasons.some(s=>s.id===v))return v;
 const m=v.match(/^(\d{4})\s*[\/\-]\s*(\d{2,4})$/);if(m)return m[1]+'/'+m[2].slice(-2);
 return '';
}
function seasonFromDate(d){
 if(!d)return '';let best='';
 for(const s of S.settings.seasons){if(!s.open)continue;const g=dnum(d)-dnum(s.open);if(g>=-14&&g<=230&&(!best||s.open>seasonObj(best).open))best=s.id}
 return best;
}
function detectArea(v,text){
 const nv=norm(String(v||'')),nt=norm(text);
 for(const a of S.settings.areas){if(nv&&(nv===norm(a.name)||nv===norm(a.en)||nv===a.id))return a.id}
 for(const a of S.settings.areas){if(nt.includes(norm(a.name))||nt.includes(norm(a.en)))return a.id}
 return 'gen';
}
function rowsFromTable(objs){
 const out=[];let empty=0;const today=new Date().toISOString().slice(0,10);
 for(const o of objs){
  const g={};for(const k in o){const nk=hk(k);for(const f in COLS){if(g[f]===undefined&&COLS[f].map(hk).includes(nk))g[f]=o[k]}}
  const text=String(g.text==null?'':g.text).trim();if(!text){empty++;continue}
  const pub=toDate(g.pub),url=String(g.url||'').trim();
  const rid=g.id?'imp:'+String(g.id).trim():'imp:'+hash(text+'|'+pub+'|'+url);
  const lbl=String(g.season==null?'':g.season).trim().slice(0,60);
  let season=matchSeason(g.season);if(!season)season=seasonFromDate(pub);if(!season)season=lbl||'بيانات الملف';
  const rt=parseFloat(String(g.rating==null?'':g.rating).replace(',','.')),stars=rt>=1&&rt<=5?Math.round(rt):null;
  const kind=/^(post|video|منشور|فيديو|مقطع)$/i.test(String(g.kind||'').trim())?'post':'comment';
  out.push({id:rid,text,clipId:String(g.clip||g.url||rid),url,publishedAt:pub,collectedAt:toDate(g.coll)||today,season,area:detectArea(g.area,text),kind,
   official:truthy(g.official),reposted:truthy(g.reposted),query:/target|موجه/i.test(String(g.query||''))?'targeted':'general',likes:Number(g.likes)||0,demo:false,stars,review:stars!=null,platform:normPlat(g.platform)||null});
 }
 return {rows:out,empty};
}
function parseFile(name,text){
 let objs;
 if(/\.txt$/i.test(name)){
  objs=text.split(/\r?\n/).map(l=>l.trim()).filter(l=>l.length>=3).map(l=>({text:l}));
 }else if(/\.json$/i.test(name)||/^\s*[\[{]/.test(text)){
  const j=JSON.parse(text);objs=Array.isArray(j)?j:(j.items||j.data||j.rows||j.comments||[]);
  objs=objs.map(o=>typeof o==='string'?{text:o}:o);
 }else{
  const t=parseCSV(text);if(t.length<2)throw new Error('الملف لا يحتوي صفوفًا');
  const hd=t[0].slice();
  if(!hd.some(h=>COLS.text.map(hk).includes(hk(h)))){
   /* no obvious text column: use the column with the longest average text */
   let bi=0,bl=-1;hd.forEach((h,i)=>{const l=t.slice(1,60).reduce((s,r)=>s+String(r[i]||'').length,0);if(l>bl){bl=l;bi=i}});
   hd[bi]='text';
  }
  objs=t.slice(1).map(r=>{const o={};hd.forEach((h,i)=>o[h]=r[i]);return o});
 }
 return rowsFromTable(objs);
}
async function addFiles(list){

 }

 if(bad.length)$('upInfo').textContent='لم نقرأ: '+bad.join('، ');
 else if(PEND.length)$('upInfo').textContent='جاهزة للتحليل: '+fmt(PEND.reduce((s,f)=>s+f.rows.length,0))+' صفًا من '+PEND.length+' ملف. اضغطوا «حلّلوا الآراء».';
}

 }

}

async function pdfBlob(canvases){
 const enc=new TextEncoder(),parts=[],offs=[];let off=0;
 const put=x=>{parts.push(x);off+=x.byteLength!==undefined?x.byteLength:x.length};
 const s8=s=>enc.encode(s);
 put(new Uint8Array([0x25,0x50,0x44,0x46,0x2D,0x31,0x2E,0x34,0x0A,0x25,0xE2,0xE3,0xCF,0xD3,0x0A]));
 const n=canvases.length;
 const o=(id,body)=>{offs[id]=off;put(s8(id+' 0 obj\n'+body+'\nendobj\n'))};
 o(1,'<< /Type /Catalog /Pages 2 0 R >>');
 o(2,'<< /Type /Pages /Kids ['+canvases.map((_,i)=>(4+3*i)+' 0 R').join(' ')+'] /Count '+n+' >>');
 o(3,'<< /Title (Boulevard World organizer report) /Producer (Event Advisor) >>');
 for(let i=0;i<n;i++){
  const cv=canvases[i],blob=await new Promise(r=>cv.toBlob(r,'image/jpeg',0.9));
  const jpg=new Uint8Array(await blob.arrayBuffer()),pid=4+3*i,cid=5+3*i,iid=6+3*i,wp=595,hp=842;
  o(pid,'<< /Type /Page /Parent 2 0 R /MediaBox [0 0 '+wp+' '+hp+'] /Resources << /XObject << /Im0 '+iid+' 0 R >> >> /Contents '+cid+' 0 R >>');
  const cs='q '+wp+' 0 0 '+hp+' 0 0 cm /Im0 Do Q';
  o(cid,'<< /Length '+cs.length+' >>\nstream\n'+cs+'\nendstream');
  offs[iid]=off;
  put(s8(iid+' 0 obj\n<< /Type /XObject /Subtype /Image /Width '+cv.width+' /Height '+cv.height+' /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length '+jpg.length+' >>\nstream\n'));
  put(jpg);put(s8('\nendstream\nendobj\n'));
 }
 const total=4+3*n,xo=off;
 let x='xref\n0 '+total+'\n0000000000 65535 f \n';
 for(let id=1;id<total;id++)x+=String(offs[id]).padStart(10,'0')+' 00000 n \n';
 x+='trailer\n<< /Size '+total+' /Root 1 0 R /Info 3 0 R >>\nstartxref\n'+xo+'\n%%EOF\n';
 put(s8(x));
 return new Blob(parts,{type:'application/pdf'});
}

  if(!x)return {h:'<div>ما عندنا مواد من '+PLAT[pl]+' في هذا النطاق. المتاح الآن: '+esc(srcTxt())+'.</div><div class="small">الربط المباشر مع المنصات ضمن «قريبًا»، وحاليًا تدخل البيانات المجمّعة أو الملفات المرفوعة فقط.</div>',acts:[A('مصادر البيانات','go',{v:'data',pri:true})],steps:[stepsScope(),'بحثت عن مواد من '+PLAT[pl]]};
  const soc=pl==='tiktok'||pl==='x';
  let h='<div><b>'+PLAT[pl]+'</b>: '+mAd(x.n)+(x.official?'، منها '+fmt(x.official)+' رسمية أو إعلامية أو إعلانية':'')+'.</div><div>'+sentLine(x)+'.</div>';
  if(x.negTop)h+='<div>أكثر ما اشتكوا منه: '+asp1(x.negTop)+'.</div>';
  if(x.posTop)h+='<div>أكثر ما أعجبهم: '+asp1(x.posTop)+'.</div>';
  if(!x.negTop&&!x.posTop)h+='<div>ما ظهر جانب واضح (انتظار، زحام، أسعار…) في مواد هذه المنصة ضمن النطاق.</div>';
  const qn=repQuotes(i=>i.platform===pl&&i.sent==='neg',2),qp=repQuotes(i=>i.platform===pl&&i.sent==='pos',1);
  if(qn.length)h+='<div class="small" style="margin-top:6px">أمثلة سلبية:</div>'+qn.map(cq).join('');
  if(qp.length)h+='<div class="small" style="margin-top:6px">أمثلة إيجابية:</div>'+qp.map(cq).join('');
  h+=soc?'<div class="note warn">مواد تيك توك وX غالبًا منشورات وعناوين من صنّاع محتوى وإعلام وليست تعليقات زوار، فهي إشارة مبدئية وليست قياسًا لرأي الزوار.</div>':'<div class="small">المشاعر هنا من النجوم حين تتوفر وإلا من نص التقييم، والعينة مراجعون اختاروا الكتابة فقد لا تمثّل كل الزوار.</div>';
  return {h,acts:[A('عرض المواد','platEv',{p:pl,pri:true}),A('جدول المنصات','go',{v:'happened'})],steps:[stepsScope(),'جمعت مواد '+PLAT[pl]+' ('+fmt(x.n)+')','حسبت المشاعر ثم الجوانب الأكثر ذكرًا']};
 }
 if(!pls.length)return {h:'<div>ما عندنا مواد من منصات في هذا النطاق بعد.</div>',acts:[A('مصادر البيانات','go',{v:'data',pri:true})],steps:[stepsScope()]};
 let h='<div><b>مقارنة المنصات</b> ('+esc(scopeTxt0())+'):</div><ul>'+pls.map(x=>'<li><b>'+PLAT[x.p]+'</b> ('+mAd(x.n)+(x.official?'، منها '+fmt(x.official)+' رسمية أو إعلامية':'')+'): '+sentLine(x)+(x.negTop?' · أكثر شكوى «'+ASPECTS[x.negTop.a].label+'»':'')+(x.posTop?' · أكثر إشادة «'+ASPECTS[x.posTop.a].label+'»':'')+'</li>').join('')+'</ul>';
 const negs=[...new Set(pls.filter(x=>x.negTop).map(x=>x.negTop.a))];
 if(pls.filter(x=>x.negTop).length>1)h+=negs.length===1?'<div>الشكوى الأبرز واحدة في المنصات: «'+ASPECTS[negs[0]].label+'».</div>':'<div>الشكوى الأبرز تختلف بين المنصات: '+pls.filter(x=>x.negTop).map(x=>PLAT[x.p]+' «'+ASPECTS[x.negTop.a].label+'»').join('، ')+'.</div>';
 const tp=topicStats(scopeItems(V.ui.season,Object.assign({},V.ui,{plat:'all'}))).filter(t=>t.plats.size>=2).slice(0,3);
 h+=tp.length?'<div>مواضيع ظهرت في أكثر من منصة: '+tp.map(t=>esc(ASPECTS[t.a].label)+' ('+[...t.plats].map(q=>PLAT[q]).join(' + ')+')').join('، ')+'.</div>':'<div>ما ظهر موضوع مشترك بين المنصات بما يكفي في هذا النطاق.</div>';
 if(pls.some(x=>x.p==='tiktok'||x.p==='x'))h+='<div class="note warn">منشورات تيك توك وX غالبًا عناوين ومنشورات صنّاع محتوى وإعلام وليست تعليقات زوار، فمقارنتها بقوقل ماب تقريبية.</div>';
 const acts=[A('جدول المنصات','go',{v:'happened',pri:true})];pls.filter(x=>x.p==='tiktok'||x.p==='x').slice(0,2).forEach(x=>acts.push(A('عرض '+PLAT[x.p],'platEv',{p:x.p})));
 return {h,acts,steps:[stepsScope(),'جمعت مواد '+pls.length+' منصات','حسبت المشاعر والجوانب لكل منصة','قارنت بين المنصات']};
}
function sentimentAnswer(){
 const c=V.cur,s=c.sent;
 if(!s||!s.n)return {h:'<div>ما فيه آراء زوار كافية في هذا النطاق لحساب المشاعر.</div>',acts:[A('البيانات','go',{v:'data'})],steps:[stepsScope()]};
 let h=(s.n<15?'<div class="note warn">الآراء في هذا النطاق قليلة ('+fmt(s.n)+')، فالأرقام اتجاه مبدئي فقط.</div>':'')+'<div><b>مشاعر الآراء</b> ('+esc(scopeTxt())+'):</div><div>إيجابي '+pc(s.pos/s.n)+' ('+fmt(s.pos)+') · محايد '+pc(s.neu/s.n)+' ('+fmt(s.neu)+') · سلبي '+pc(s.neg/s.n)+' ('+fmt(s.neg)+') من '+mAd(s.n)+'.</div>';
 if(V.plats.length>1)h+='<ul>'+V.plats.map(x=>'<li><b>'+PLAT[x.p]+'</b>: '+sentLine(x)+'</li>').join('')+'</ul>';
 h+='<div class="small">قوقل ماب: من النجوم حين تتوفر وإلا من النص. تيك توك وX: من كلمات المدح والذم والجوانب المذكورة، وما بلا رأي واضح يُحسب محايدًا.</div>'+demoNote();
 return {h,acts:[A('أمثلة سلبية','ev',{id:cev('آراء سلبية',i=>i.sent==='neg')}),A('أمثلة إيجابية','ev',{id:cev('آراء إيجابية',i=>i.sent==='pos')}),A('جدول المنصات','go',{v:'happened'})],steps:[stepsScope(),'صنّفت '+fmt(s.n)+' مادة: إيجابي ومحايد وسلبي','قسّمتها حسب المنصة']};
}
function topicsAnswer(){
 const ts=V.topics.slice(0,5);
 if(!ts.length)return {h:'<div>ما ظهرت مواضيع متكررة في هذا النطاق.</div>',acts:[A('البيانات','go',{v:'data'})],steps:[stepsScope()]};
 const h='<div><b>أكثر المواضيع ذكرًا</b> ('+esc(scopeTxt())+'):</div><ul>'+ts.map(t=>'<li><b>'+esc(ASPECTS[t.a].label)+'</b>: '+fmt(t.n)+' ذكرًا (اشتكوا '+fmt(t.neg)+' · أشادوا '+fmt(t.pos)+(t.neu?' · محايد '+fmt(t.neu):'')+') · '+[...t.plats].map(q=>PLAT[q]).join('، ')+'</li>').join('')+'</ul><div class="small">العدّ بالذكر في المادة، وقد تذكر المادة الواحدة أكثر من موضوع.</div>';
 const a0=ts[0].a;
 return {h,acts:[A('أمثلة: '+ASPECTS[a0].label,'ev',{id:cev(ASPECTS[a0].label+': آراء الزوار',i=>i.aspects.some(z=>z.a===a0)),pri:true}),A('المواضيع','go',{v:'happened'})],steps:[stepsScope(),'عددت الجوانب المذكورة في كل مادة','رتّبتها حسب عدد الذكر']};
}
function textSearch(q){
 const nq=cn(q).replace(/^ال/,'').trim(),fn=i=>norm(i.text).includes(nq);
 const hits=P.items.filter(i=>fn(i)&&i.intent!=='official');
 if(!hits.length)return {h:'ما لقيت في البيانات الحالية مواد تذكر «'+esc(q)+'».'+'',acts:[A('البيانات','go',{v:'data'})],steps:['بحثت في '+fmt(P.items.length)+' مادة','ما وجدت تطابقًا']};
 const web=hits.filter(i=>i.platform==='tiktok'||i.platform==='x').length,seasons=[...new Set(hits.map(i=>i.season))];
 const top=hits.slice().sort((p,q)=>(q.likes-p.likes)||(q.publishedAt||'').localeCompare(p.publishedAt||'')).slice(0,3);
 const h='<div>وجدت <b>'+fmt(hits.length)+'</b> مادة تذكر «'+esc(q)+'» في '+seasons.length+(seasons.length===1?' موسم':' مواسم')+(web?' (منها '+web+' من تيك توك وX)':'')+':</div>'+top.map(cq).join('')+'<div class="small">هذا بحث نصي في المواد المحمّلة، وليس إحصاءً.</div>';
 return {h,acts:[A('كل المواد','ev',{id:cev('مواد تذكر «'+q+'»',fn,true),pri:true})],steps:['بحثت عن «'+q+'» في '+fmt(P.items.length)+' مادة','استبعدت المواد الرسمية']};
}
function statusAnswer(v){
 ACT.status({dataset:{v}});
 const m=mode();
 return {h:'<div>تمام، حالة الفعالية الحين: <b>'+(m==='live'?'ما زالت قائمة':'انتهت')+'</b>. التوصيات صارت: «'+(m==='live'?'تحسينات تقدرون تسوونها الحين':'توصيات للموسم القادم')+'».</div>',acts:[A('التوصيات','go',{v:'recs',pri:true})],steps:['غيّرت حالة الفعالية','أعدت ترتيب التوصيات']};
}
function updateAnswer(){
 return {h:'<div>ما عندنا اتصال مباشر بأي منصة (هذا ضمن «قريبًا»)، فالتحديث يتم بإضافة بيانات جديدة: ارفعوا ملفًا جديدًا واختاروا منصته، أو ألصقوا تعليقات. ما يتكرر لا يُحسب مرتين، وبعدها نعرض لكم «الجديد منذ آخر تحليل».</div>',acts:[A('البيانات','go',{v:'data',pri:true})],steps:[]};
}

/* ---------- router ---------- */
function route(t,ent){
 chatLast=t;
 const has=r=>r.test(t);
 if(has(/^(?:مرحبا|اهلا|هلا|السلام|صباح|مساء|hi\b|hello)/)&&t.length<30)return {h:'أهلًا. اسألوني عن جانب في الفعالية أو منطقة، أو قولوا «أعطني تقرير» أو «كم متوسط النجوم؟».',acts:[],steps:[]};
 if(has(/شكرا|يعطيك العافيه|thanks/))return {h:'العفو. إذا بغيتم شيئًا ثانيًا أنا موجود.',acts:[],steps:[]};
 if(has(/تقرير|report|pdf|تنزيل|نزل|معاينه/)){if(!activeRows().length)return emptyAnswer();applyEnt(ent);return reportAnswer()}
 if(has(/كاميرا|كاميرات|camera|مباشر|(?<![a-z])live(?![a-z])|ربط|(?<![a-z])api(?![a-z])|اتصال|تقاريري|رفع تقارير|قريبا|الميزات القادمه|ميزات قادمه|وش الجاي/))return futureAnswer();
 if(has(/فعاليه جديده|فعاليه ثانيه|فعاليه اخري|غير الفعاليه|بدل الفعاليه|اضافه فعاليه|فعاليات|اي فعاليه/))return eventsAnswer();
 if(has(/(?:^|\s)(?:حدث|تحديث|update|refresh)/)||has(/اجمع.*جديد/))return updateAnswer();
 if(has(/(?:الفعاليه|الموسم|المهرجان)/)&&has(/(?:انتهت|خلصت|منتهيه|انتهي)/))return statusAnswer('ended');
 if(has(/(?:لسا|لسه|ما زالت|مازالت|للحين)/)&&has(/(?:قائمه|شغاله|مستمره|شغال)/))return statusAnswer('live');
 if(has(/وش تقدر|ايش تقدر|وش تسوي|ايش تسوي|مساعده|ساعدني|كيف استخدم|help|what can you/))return helpAnswer();
 if(has(/مصدر|من وين|كم عينه|كم راي|دقه|تصنيف|موثوق|وش البيانات|ايش البيانات|البيانات اللي عندك|البيانات الي عندك|source|accuracy|sample/)&&!ent.aspects.length)return dataAnswer();
 if(!activeRows().length)return emptyAnswer();
 if(has(/نجوم|نجمه|نجمات|stars|rating|متوسط التقييم|معدل التقييم|متوسط التقيم/))return starsAnswer();
 const sv=t.match(/(?:^|\s)(?:ابحث|بحث|دور|لاقي|لقي)\s*(?:لي\s*)?(?:عن|على|في|ب)?\s*(.+)$/);
 if(sv&&!ent.aspects.length&&!ent.area&&sv[1].trim().length>=2)return textSearch(sv[1].trim());
 applyEnt(ent);
 const asp=ent.aspects;
 const REC=/توصي|اقتراح|اقترح|وش اسوي|ايش اسوي|ايش نسوي|وش نسوي|وش القرار|قرار|اجراء|ماذا نفعل|recommend|what should/;
 if(!asp.length&&!has(REC)&&(ent.plat||has(/منصه|منصات|سوشال|سوشل|كلمات مفتاحيه|كي ?ورد|keyword/)))return platformsAnswer(ent.plat);
 if(!asp.length&&has(/مشاعر|sentiment|محايد|نسبه الايجابي|نسبه السلبي|ايجابي وسلبي|سلبي وايجابي|توزيع الاراء|كم.*(?:ايجابي|سلبي)/))return sentimentAnswer();
 if(!asp.length&&has(/مواضيع|موضوع|topics|اكثر ما يذكر|اكثر ذكرا|الاكثر ذكرا|الاكثر تكرارا|وش يتكلمون|ايش يتكلمون|يتكلمون عن/))return topicsAnswer();
 if(has(/تغطيه|ما عندنا بيانات|ناقصه/)||(has(/بيانات/)&&has(/(?:مناطق|منطقه)/)))return coverage();
 if(has(/(?:منطقه|مناطق)/)&&has(/(?:اكثر|اسوا|اعلي|اهم|افضل|احسن|ترتيب)/)&&!ent.area)return arearank();
 if(has(REC))return recsAnswer(asp);
 if(has(/فرص|فرصه|فكره|افكار|محتوي|opportunit|content idea/))return oppsAnswer();
 if(has(/دليل|ادله|اثبات|مقتطف|تعليقات|وش يقولون|ايش يقولون|شو يقولون|وش قالوا|امثله|evidence|quotes/))return evidenceAnswer(asp);
 if(has(/مراحل|مرحله|رحله|stage|journey/)&&!asp.length)return stagesAnswer();
 if(has(/نقاط القوه|احسن|افضل|ايجابي|مميز|يعجب|اعجب|strength|best/)&&!asp.length)return strengthsAnswer();
 if(has(/اسوا|اكبر مشكله|اهم مشكله|تحديات|شكاوي|مشاكل|مشكله|عوائق|ازعج|نقاط الالم|معاناه|pain|worst|problems|issues/)&&!asp.length)return worstAnswer();
 if(asp.length){const bs=asp.slice(0,2).map(aspectBlock);return {h:weakNote()+bs.map(b=>b.h).join('<hr class="cl">')+demoNote(),acts:bs.flatMap(b=>b.acts).slice(0,5),steps:[stepsScope(),stepsData()].concat(bs[0].steps)}}
 if(ent.area)return areaAnswer(ent.area);
 if(has(/قارن|مقارنه|مقابل|السابق|الماضي|compare|vs/))return compareAnswer();
 if(has(/وش تغير|ايش تغير|شو تغير|تغير|الجديد|هذا الاسبوع|هالاسبوع|ملخص|وضع|وش صار|what changed|summary|overview/))return summaryAnswer();
 if(has(/موسم|فتره|يوم|ايام/)&&(ent.season||ent.period))return summaryAnswer();
 return {h:'ما فهمت طلبكم بدقة. أقدر أجاوب عن جانب (الانتظار، الزحام، الأسعار، الأكل…) أو منطقة أو موسم، وأعطيكم تقريرًا أو توصيات، وأقول لكم متوسط النجوم. جرّبوا أحد الاقتراحات تحت.',acts:[],steps:[]};
}

/* ---------- chat window ---------- */
function addMsg(kind,html){const el=document.createElement('div');el.className='m '+kind;el.innerHTML=html;$('chatLog').appendChild(el);scrollLog();return el}
function scrollLog(){const l=$('chatLog');l.scrollTop=l.scrollHeight}
async function showReply(r){
 const el=addMsg('a',(r.steps&&r.steps.length?'<details class="tr" open><summary>أراجع البيانات…</summary><ul></ul></details>':'')+'<div class="body"></div><div class="acts"></div>');
 const ul=el.querySelector('ul');
 if(ul){for(const s of r.steps){await sleep(STEP_MS);const li=document.createElement('li');li.textContent=s;ul.appendChild(li);scrollLog()}await sleep(STEP_MS*.7);const d=el.querySelector('details');d.querySelector('summary').textContent='كيف وصلت للجواب ('+r.steps.length+')';d.open=false}
 el.querySelector('.body').innerHTML=r.h;el.querySelector('.acts').innerHTML=(r.acts||[]).map(actBtn).join('');scrollLog();
 if(r.after)r.after();
}
async function chatSend(text){
 text=String(text||'').trim();if(!text||chatBusy)return;
 chatBusy=true;$('chatIn').value='';addMsg('u',esc(text));
 try{
  const t=cn(text),ent={aspects:detAspects(t),area:detArea(t),season:detSeason(t),period:detPeriod(t),plat:detPlat(t)};
  let r;try{r=route(t,ent)}catch(e){r={h:'تعثّر تحليل هذا الطلب. جرّبوا صياغة أخرى.',acts:[],steps:[]}}
  await showReply(r);
 }finally{chatBusy=false}
}
function renderChatScope(){const e=$('chatScope');if(e&&V&&V.ui)e.textContent='يعمل على: '+scopeTxt()}
function setChat(on){document.body.classList.toggle('chat-open',on);$('chat').classList.toggle('on',on);if(on){setTimeout(()=>{try{$('chatIn').focus({preventScroll:true})}catch(e){}},50)}}
const narrow=()=>window.matchMedia&&window.matchMedia('(max-width:999px)').matches;
ACT.chatClose=()=>setChat(false);
ACT.chip=t=>{if(!$('chat').classList.contains('on'))setChat(true);chatSend(t.dataset.q)};
ACT.cdo=t=>{
 applyCs(t.dataset.cs);const w=t.dataset.do;
 if((w==='go'||w==='area')&&narrow())setChat(false);
 if(w==='ev'){const e=CEV[t.dataset.id];if(e){D={title:e.title,fn:e.fn,g:6,t:4,all:e.all};renderDrawer()}}
 else if(w==='save')ACT.saveRec({dataset:{key:t.dataset.key}});
 else if(w==='report')openPreview();
 else if(w==='dl')makeReport();
 else if(w==='go')ACT.tab({dataset:{v:t.dataset.v}});
 else if(w==='area')ACT.area({dataset:{id:t.dataset.id}});
 else if(w==='platEv'){if(narrow())setChat(false);ACT.platEv(t)}
};
const CHIPS=['قارن بين المنصات','كيف مشاعر الزوار؟','وش أكثر ما أزعج الزوار؟','وش أعجب الزوار؟','وش أهم توصية؟','أعطني تقرير'];
function initChat(){
 $('chatChips').innerHTML=CHIPS.map(q=>'<button class="chipb" type="button" data-act="chip" data-q="'+esc(q)+'">'+esc(q)+'</button>').join('');
 $('chatForm').addEventListener('submit',e=>{e.preventDefault();chatSend($('chatIn').value)});
 $('btnChat').addEventListener('click',()=>setChat(!$('chat').classList.contains('on')));
 $('chatFab').addEventListener('click',()=>setChat(true));
 addMsg('a','<div class="body"><div>أهلًا، أنا مستشار الفعالية. اسألوني عن آراء الزوار: المشاعر، الشكاوى المتكررة، ما أعجبهم، المقارنة بين المنصات، أو اطلبوا «تقرير». أجاوب من البيانات المجمّعة فقط.</div>'+(demoOn()?'<div class="small" style="margin-top:6px">بيانات بوليفارد وورلد مجمّعة مسبقًا، وليست اتصالًا مباشرًا بأي منصة.</div>':'')+'</div>');
 if(window.matchMedia&&window.matchMedia('(min-width:1200px)').matches)setChat(true);
}


/* ---------- boot ---------- */
ensureSeasons();processAll();
if(!S.lastOk)initStamp();
wire();initChat();renderAll();

})();

</script>
